<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>G1 Live Tries</title>
<style>
:root{--bg:#0f1216;--panel:#181d23;--line:#2b333c;--text:#e8edf2;--dim:#98a4b0;--ok:#3fb77f;--bad:#e5604d;--wait:#e0a93b;--a:#6aa9ff;--b:#c58bf2;--c:#62c9c0}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,sans-serif}
#app{display:grid;grid-template-columns:1fr 380px;height:100vh}
#grid{display:grid;gap:4px;padding:4px;min-height:0;min-width:0}
.tile{position:relative;background:#000;overflow:hidden;min-height:0;cursor:zoom-in;border:2px solid transparent;border-radius:4px}
.tile img{width:100%;height:100%;object-fit:contain;display:block}
.tile.ok{border-color:var(--ok)}.tile.bad{border-color:var(--bad)}.tile.wait{border-color:var(--wait)}
.cap{position:absolute;left:0;right:0;bottom:0;padding:3px 7px;background:#000b;font-size:12.5px;display:flex;justify-content:space-between;gap:8px}
.flag{position:absolute;top:5px;left:5px;padding:2px 8px;border-radius:3px;font-weight:600;font-size:13px;color:#08110c}
.ok .flag{background:var(--ok)}.bad .flag{background:var(--bad)}.wait .flag{background:var(--wait)}
#grid.solo{grid-template-columns:1fr!important;grid-template-rows:1fr!important}#grid.solo .tile:not(.big){display:none}#grid.solo .tile{cursor:zoom-out}
aside{background:var(--panel);border-left:1px solid var(--line);padding:12px 14px;overflow:auto}
h1{font-size:17px;margin:0 0 2px}h2{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin:16px 0 6px}
.sub{color:var(--dim);font-size:12px;word-break:break-all}
.job{margin-bottom:9px}.row{display:flex;justify-content:space-between;gap:8px}.row b{font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:3px 0}.bar i{display:block;height:100%;background:var(--a)}
.dots{display:flex;flex-wrap:wrap;gap:2px}.dots i{width:8px;height:8px;border-radius:2px;background:var(--ok)}.dots i.bad{background:var(--bad)}.dots i.wait{background:var(--wait)}
.why{color:var(--dim);font-size:12px}.key{display:flex;gap:10px;flex-wrap:wrap;color:var(--dim);font-size:12px;margin-top:4px}.key span[style]::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;background:var(--k)}
svg{width:100%;display:block}.score{display:grid;grid-template-columns:150px 1fr 30px;gap:6px;align-items:center;font-size:12px;margin:2px 0}.score .bar{margin:0}
#full{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:5}
#full button{font:600 20px system-ui;padding:18px 34px;border:0;border-radius:6px;background:var(--a);color:#061020;cursor:pointer}
@media(max-width:900px){#app{display:block;height:auto}#grid{grid-template-columns:repeat(2,1fr)!important;grid-template-rows:none!important}aside{border:0}}
</style></head><body>
<div id="full"><button>Click for full screen</button></div>
<div id="app"><main id="grid"></main><aside>
<h1>G1 live tries</h1><div class="sub" id="policy">Waiting for tries</div>
<h2 id="ph" hidden>Practice, last tries</h2><div id="practice"></div>
<h2>Final test</h2><div id="jobs"></div>
<div class="key"><span style="--k:var(--ok)">worked</span><span style="--k:var(--bad)">knocked / fell</span><span style="--k:var(--wait)">out of time</span></div>
<h2>How RL learned the throw</h2><div id="curve"></div><div class="key" id="curvekey"></div>
<h2>Throw scores, of 96 tries</h2><div id="scores"></div>
<h2>Tip</h2><div class="why">Click a video to enlarge it, click again to go back. Press F to toggle full screen.</div>
</aside></div>
<script>
const $=id=>document.getElementById(id),tiles=new Map,cols={"1":1,"2":2,"3":2,"4":2,"5":3,"6":3,"7":4,"8":4,"9":3};
const fs=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});
$("full").onclick=()=>{fs();$("full").remove()};addEventListener("keydown",e=>{if(e.key=="f"||e.key=="F")fs()});
const kind=o=>o=="ok"?"ok":o=="timeout"?"wait":"bad",label={place0:"Cup A",place1:"Cup B",place2:"Top cup",toss:"Throw alone",full:"Whole sequence"};
function tile(n){let t=tiles.get(n);if(t)return t;const d=document.createElement("div");d.className="tile";d.innerHTML='<img alt="Try in progress"><div class="flag" hidden></div><div class="cap"><span></span><span></span></div>';
 d.onclick=()=>{d.classList.toggle("big");$("grid").classList.toggle("solo",d.classList.contains("big"))};$("grid").append(d);t={d,img:d.querySelector("img"),flag:d.querySelector(".flag"),l:d.querySelector(".cap span"),r:d.querySelector(".cap span+span")};tiles.set(n,t);pump(n,t);layout();return t}
function layout(){const n=tiles.size,c=cols[n]||Math.ceil(Math.sqrt(n)),r=Math.ceil(n/c);$("grid").style.gridTemplateColumns=`repeat(${c},1fr)`;$("grid").style.gridTemplateRows=`repeat(${r},1fr)`}
async function pump(n,t){for(;;){const s=performance.now();try{const r=await fetch(`/frame/${n}?${s}`);if(r.ok){const u=URL.createObjectURL(await r.blob()),o=t.img.src;t.img.src=u;if(o)setTimeout(()=>URL.revokeObjectURL(o),2000)}}catch{}await new Promise(k=>setTimeout(k,Math.max(0,110-(performance.now()-s))))}}
function line(pts,x,y){return pts.map((p,i)=>(i?"L":"M")+x(p[0]).toFixed(1)+" "+y(p[1]).toFixed(1)).join("")}
function smooth(p,w=5){return p.map((q,i)=>{const s=p.slice(Math.max(0,i-w+1),i+1);return[q[0],s.reduce((a,b)=>a+b[1],0)/s.length]})}
let curveKey="";function drawCurves(c){const k=JSON.stringify(c);if(k==curveKey)return;curveKey=k;const W=350,H=170,L=28,B=18,names=Object.keys(c),col=["--a","--b","--c","--wait"],max=Math.max(1,...names.flatMap(n=>c[n].train.map(p=>p[0])));
 const x=v=>L+(W-L-6)*v/max,y=v=>6+(H-B-6)*(1-v);let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Success rate by training round">`;
 for(const v of[0,.25,.5,.75,1])s+=`<line x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="2" y="${y(v)+4}" fill="var(--dim)" font-size="10">${v*100}%</text>`;
 s+=`<text x="${W-6}" y="${H-5}" text-anchor="end" fill="var(--dim)" font-size="10">training round ${max}</text>`;
 names.forEach((n,i)=>{const a=`var(${col[i%4]})`;s+=`<path d="${line(smooth(c[n].train),x,y)}" fill="none" stroke="${a}" stroke-width="2" stroke-linejoin="round"/>`;for(const p of c[n].test)s+=`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="3" fill="${a}"/>`});
 $("curve").innerHTML=s+"</svg>";$("curvekey").innerHTML=names.map((n,i)=>`<span style="--k:var(${col[i%4]})">${n.replace(/^t_ppo_/,"PPO ")}</span>`).join("")+"<span>dots: fixed-layout tests</span>"}
function esc(s){return String(s).replace(/[<&]/g,m=>m=="<"?"&lt;":"&amp;")}
async function tick(){try{const s=await(await fetch("/status")).json();
 for(const v of s.slots){const t=tile(v.slot);t.l.textContent=`${v.round!=null?`Round ${v.round} · `:""}${label[v.job]||v.job} · ${v.stage}`;t.r.textContent=`${v.t}/${v.limit}s${v.misses?` · ${v.misses} missed`:""}`;t.d.classList.remove("ok","bad","wait");t.flag.hidden=!v.final;if(v.final){t.d.classList.add(kind(v.final));t.flag.textContent=v.final=="ok"?"Worked":v.final}}
 if(s.run){$("policy").textContent=s.run.name+": "+s.run.policy;$("jobs").innerHTML=s.run.jobs.map(j=>{const p=j.done?Math.round(100*j.ok/j.done):0,why=Object.entries(j.outcomes).filter(e=>e[0]!="ok").map(e=>`${e[1]} ${esc(e[0])}`).join(", ");
  return`<div class="job"><div class="row"><span>${label[j.job]||esc(j.job)}</span><b>${j.ok}/${j.done}${j.done?` · ${p}%`:""}</b></div><div class="bar"><i style="width:${100*j.done/j.total}%"></i></div><div class="dots">${j.tries.map(t=>`<i class="${kind(t[1])}" title="${esc(t[0])}: ${esc(t[1])}"></i>`).join("")}</div>${why?`<div class="why">${why}</div>`:""}</div>`}).join("")}
 if(s.practice){const p=s.practice;$("ph").hidden=false;$("practice").innerHTML=`<div class="job"><div class="row"><span>${p.round!=null?`Trained to round ${p.round}`:"Real speed"}</span><b>${p.ok}/${p.last}</b></div><div class="dots">${p.recent.map(t=>`<i class="${kind(t[1])}" title="${esc(t[0])}: ${esc(t[1])}"></i>`).join("")}</div><div class="why">${p.tries} tries watched</div></div>`}
 drawCurves(s.curves);$("scores").innerHTML=s.scores.map(r=>`<div class="score"><span>${esc(r[0])}</span><div class="bar"><i style="width:${r[1]/.96}%"></i></div><b>${r[1]}</b></div>`).join("")}catch{}setTimeout(tick,1000)}
tick();
</script></body></html>
