[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robot_arm"
version = "0.1.0"
description = "Teach a simulated humanoid (Unitree G1) to stack cups and throw a cap from phone videos (MuJoCo)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2",
    "numpy",
    "scipy",
    "gymnasium>=1.0",
    "torch",
    "opencv-python>=4.8",
    "mediapipe>=0.10.14",
    "imageio[ffmpeg]",
    "matplotlib",
    "tqdm",
    "huggingface_hub",
]

[project.optional-dependencies]
dev = ["pytest"]
pose = ["rtmlib", "onnxruntime"]  # RTMW arm tracking (scripts/g1_track_landmarks.py)

[tool.setuptools.packages.find]
include = ["robot_arm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
